<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeee8">
  <meta name="description" content="У каждого свой характер. И своя частота. Пройди 8 вопросов и узнай, какая ты рация.">
  <title>Какая ты рация? — На одной волне</title>
  <style>
    :root{--paper:#efeee8;--ink:#20251f;--muted:#72776d;--line:#d4d6cb;--green:#d9f36d;--purple:#c6b9ed;--white:#fafaf5;--ease:cubic-bezier(.22,1,.36,1)}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;cursor:pointer}
    button:disabled{cursor:default}
    button:focus-visible,a:focus-visible{outline:3px solid #7053b5;outline-offset:5px}
    button{touch-action:manipulation}
    ::selection{background:var(--purple);color:var(--ink)}
    [hidden]{display:none!important}
    .shell{max-width:1440px;margin:auto;padding:0 64px}
    .header{height:112px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:14px;letter-spacing:.025em;line-height:1.2}
    .brand-mark{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%;transform:rotate(-12deg)}
    .header-right{display:flex;align-items:center;gap:30px}
    .mono{font-family:'Courier New',monospace;font-size:11px;line-height:1.5;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    .status{display:flex;align-items:center;gap:8px}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#637c37;box-shadow:0 0 0 4px #637c3710}
    .sound-btn{display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line);width:40px;height:40px;border-radius:50%;transition:background .2s,border-color .2s}
    .sound-btn:hover{background:var(--white);border-color:var(--ink)}
    .sound-btn[aria-pressed="true"]{background:var(--green);border-color:var(--ink)}
    main{min-height:680px}
    .view{animation:enter .55s var(--ease) both}
    .view.leaving{animation:leave .17s ease both;pointer-events:none}
    .split{display:grid;grid-template-columns:1.04fr 1fr;align-items:center;gap:40px;padding:48px 0 32px;min-height:650px}
    .eyebrow{display:flex;align-items:center;gap:10px;margin:0 0 26px}
    .eyebrow::before{content:'';width:22px;height:1px;background:var(--ink)}
    h1,h2,p{margin-top:0}
    h1{font-size:clamp(72px,7.3vw,106px);letter-spacing:-.075em;line-height:.98;font-weight:800;margin-bottom:28px}
    h1 .highlight{position:relative;display:inline-block;z-index:0}
    h1 .highlight::after{content:'';position:absolute;left:-5px;right:-8px;bottom:4px;height:39%;background:var(--purple);z-index:-1;transform:rotate(-3deg);border-radius:2px}
    .intro-copy{font-size:17px;line-height:1.65;color:#64695f;max-width:380px;margin-bottom:30px}
    .primary{display:inline-flex;align-items:center;justify-content:center;gap:32px;min-height:58px;border:1px solid var(--ink);border-radius:9px;padding:17px 24px;background:var(--ink);color:var(--white);font-size:15px;font-weight:700;transition:transform .22s var(--ease),background .2s,box-shadow .2s}
    .primary:hover:not(:disabled){background:#35402d;transform:translateY(-3px);box-shadow:0 6px 0 #20251f16}
    .primary:active:not(:disabled){transform:translateY(0)}
    .primary:disabled{opacity:.32}
    .primary svg{transition:transform .25s var(--ease)}
    .primary:hover svg{transform:translateX(4px)}
    .button-caption{margin:16px 0 0;color:var(--muted);font-size:11px;letter-spacing:.01em;display:flex;gap:10px;align-items:center}
    .button-caption span+span::before{content:'·';margin-right:10px}
    .hero-note{display:flex;align-items:center;gap:12px;margin-top:40px;font-size:12px;color:var(--muted)}
    .avatars{display:flex;padding-left:0}
    .avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--purple);border:2px solid var(--paper);margin-left:-6px;color:var(--ink)}
    .avatar:first-child{margin-left:0;background:#d9dfc9}
    .avatar:last-child{background:#f3cc9b}
    .stage{position:relative;min-width:0;height:550px;display:grid;place-items:center;isolation:isolate}
    .stage::before{content:'';position:absolute;width:90%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#dfe4cb 0%,#e6e7da 50%,transparent 71%);z-index:-2}
    .orbit{position:absolute;width:82%;aspect-ratio:1;border:1px solid #cbd0be;border-radius:50%;z-index:-1}
    .orbit.two{width:62%;border-style:dashed;opacity:.65;animation:spin 85s linear infinite}
    .orbit.three{width:99%;border-color:#d8dace}
    .orbit.one::after{content:'';position:absolute;top:16%;left:12%;width:9px;height:9px;border-radius:50%;background:var(--purple);border:3px solid var(--paper);box-sizing:content-box}
    .stage-cross{position:absolute;color:#8c9580;font:18px 'Courier New',monospace}
    .cross-a{top:35px;left:10px}.cross-b{bottom:45px;right:8px}
    .stage-label{position:absolute;top:18px;right:4px;color:#7e8574;font-size:10px}
    .radio-wrap{position:relative;width:310px;max-width:66%;transform:rotate(-12deg);animation:float 6s ease-in-out infinite;filter:drop-shadow(14px 24px 14px #26302025)}
    .radio-art{display:block;width:100%;height:auto;overflow:visible}
    .radio-led{animation:blink 3.2s ease-in-out infinite}
    .floating-label{position:absolute;bottom:88px;left:0;display:flex;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:7px;padding:12px 14px;box-shadow:0 5px 15px #20251f06;transform:rotate(-5deg);font-size:10px;animation:labelFloat 6s ease-in-out infinite}
    .floating-label .tiny-wave{color:#597938}
    .live-badge{position:absolute;top:130px;right:2px;display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--green);border:1px solid #b9d35c;border-radius:5px;transform:rotate(7deg)}
    .stage-bottom{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.12em;color:#8c9282}
    .frequency{border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:62px;position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 20px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(2% - 1px),#aab19e65 calc(2% - 1px),#aab19e65 2%) left top / 100% 9px no-repeat}
    .frequency span{background:var(--paper);padding:7px 12px 0;color:#7f8577;z-index:1}
    .frequency .frequency-active{color:var(--ink);position:relative}
    .frequency-active::before{content:'';position:absolute;top:-18px;height:16px;width:2px;background:var(--ink);left:50%}
    .frequency-active::after{content:'';position:absolute;left:10%;right:10%;height:15px;background:var(--green);bottom:0;z-index:-1;transform:rotate(-2deg)}
    .collection{display:flex;justify-content:space-between;align-items:center;padding:29px 0;gap:20px}
    .collection-label{color:var(--muted);white-space:nowrap;font-size:10px}
    .model-list{display:flex;flex-wrap:wrap;gap:10px 21px;justify-content:flex-end;color:#555e4f;font-size:11px;font-weight:600}
    .model-list span{white-space:nowrap}
    .model-list span::before{content:'✳';font-size:10px;margin-right:7px;color:#929b85}
    .footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--line);padding:24px 0 28px;color:#878b81;font-size:10px;line-height:1.6}
    .footer .footer-end{display:flex;gap:7px;align-items:center}
    .quiz-view{padding:42px 0 48px;min-height:680px}
    .quiz-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .text-button{border:0;background:none;padding:8px 0;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#69715f;transition:color .2s}
    .text-button:hover{color:var(--ink)}
    .progress-track{height:4px;background:#dcdfd2;overflow:hidden;border-radius:4px;margin-bottom:34px}
    .progress-fill{height:100%;background:#7e9560;border-radius:4px;transition:width .5s var(--ease)}
    .question-layout{display:grid;grid-template-columns:1.5fr 1fr;gap:60px;align-items:center}
    .question-category{margin-bottom:14px;color:#747d66}
    h2{font-size:clamp(30px,3.15vw,44px);line-height:1.12;font-weight:700;letter-spacing:-.045em;margin-bottom:14px}
    .question-hint{font-size:13px;line-height:1.6;color:var(--muted);margin-bottom:25px}
    .answers{display:grid;gap:10px}
    .answer{display:flex;align-items:center;gap:16px;text-align:left;background:#f7f7f0;border:1px solid #d5d9cb;border-radius:10px;padding:16px 18px;min-height:78px;width:100%;transition:border-color .2s,background .2s,transform .25s var(--ease),box-shadow .2s;animation:answerIn .45s var(--ease) both;animation-delay:calc(var(--i)*55ms)}
    .answer:hover{border-color:#899673;transform:translateX(4px);background:#fdfdf6}
    .answer[aria-pressed="true"]{border-color:#748447;background:#e3ecbf;box-shadow:0 0 0 1px #748447}
    .answer-key{flex:0 0 28px;height:28px;display:grid;place-items:center;font:11px 'Courier New',monospace;border:1px solid #cdd3c1;border-radius:6px;color:#788269;background:var(--paper);transition:background .2s,color .2s}
    .answer[aria-pressed="true"] .answer-key{background:var(--ink);border-color:var(--ink);color:var(--green)}
    .answer-title{display:block;font-size:14px;font-weight:700;line-height:1.35}
    .answer-sub{display:block;font-size:12px;line-height:1.5;margin-top:3px;color:#7b8172}
    .answer-check{width:18px;height:18px;flex:0 0 18px;margin-left:auto;border:1px solid #cdd3c1;border-radius:50%;display:grid;place-items:center;color:transparent;font-size:11px}
    .answer[aria-pressed="true"] .answer-check{background:var(--ink);border-color:var(--ink);color:var(--green)}
    .question-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px}
    .keyboard-hint{font-size:10px;color:#94998b;line-height:1.6;max-width:170px}
    .question-bottom .primary{min-height:49px;padding:13px 20px;font-size:13px}
    .quiz-side{text-align:center;align-self:center}
    .quiz-stage{height:400px}
    .quiz-stage .radio-wrap{width:220px;max-width:70%}
    .quiz-stage .stage-label{top:0;right:0;font-size:9px}
    .quiz-stage .live-badge{top:85px;right:0;font-size:9px}
    .quiz-stage .floating-label{bottom:35px;left:0;padding:10px;font-size:9px}
    .side-caption{font-size:13px;line-height:1.6;max-width:250px;margin:20px auto 0;color:#7e8671}
    .scan-view{min-height:680px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
    .radar{width:150px;height:150px;border:1px solid #bec7ae;border-radius:50%;position:relative;display:grid;place-items:center;margin-bottom:20px;background:repeating-radial-gradient(circle,transparent 0,transparent 24px,#bec7ae 25px,transparent 26px);overflow:hidden}
    .radar::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,transparent 270deg,#c4db86aa 360deg);animation:spin 1.2s linear infinite}
    .radar svg{position:relative;z-index:1}
    .scan-view h2{font-size:36px;margin:0}
    .scan-view p{font-size:13px;color:var(--muted);min-height:20px}
    .result-view{padding-bottom:34px}
    .result-view .split{padding-top:42px;gap:55px}
    .result-title{font-size:clamp(45px,5.3vw,73px);line-height:1.02;letter-spacing:-.06em;margin-bottom:18px}
    .result-title span{display:block;font-size:.62em;margin-top:5px}
    .result-tagline{font-size:18px;line-height:1.4;margin-bottom:14px;font-weight:700}
    .result-copy{font-size:14px;line-height:1.75;color:#6e7664;max-width:440px;margin-bottom:21px}
    .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:24px}
    .tag{padding:7px 10px;border:1px solid #cfd5c3;border-radius:5px;color:#69765c;font-size:10px}
    .result-quote{padding:16px 19px;border-left:3px solid var(--purple);background:#e7e5e0;border-radius:0 6px 6px 0;font-size:13px;line-height:1.6;max-width:440px;margin:0 0 26px}
    .result-quote .mono{display:block;font-size:9px;color:#818775;margin-bottom:6px}
    .result-actions{display:flex;gap:10px;flex-wrap:wrap}
    .result-actions .primary{min-height:48px;gap:12px;font-size:12px;padding:13px 16px}
    .secondary{min-height:48px;padding:13px 16px;border:1px solid #bfc7b4;border-radius:8px;background:transparent;display:inline-flex;justify-content:center;align-items:center;gap:9px;font-size:12px;font-weight:700;transition:background .2s,transform .2s}
    .secondary:hover{background:#e2e6d7;transform:translateY(-2px)}
    .result-restart{margin-top:14px}
    .result-stage{height:540px}
    .result-stage .radio-wrap{animation:revealRadio 1s var(--ease) both,float 6s 1s ease-in-out infinite}
    .result-stage .live-badge{background:var(--purple);border-color:#ad9cd6;top:105px}
    .result-stage .floating-label{bottom:57px;font-size:10px}
    .result-caption{text-align:center;color:#868d7c;font-size:10px;line-height:1.6;margin-top:16px}
    .traits{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;border-top:1px solid var(--line);padding-top:26px}
    .trait-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;margin-bottom:10px}
    .trait-track{height:6px;border-radius:5px;background:#dce0d2;overflow:hidden}
    .trait-fill{height:100%;background:#8ca16f;transform-origin:left;animation:grow .9s .4s var(--ease) both}
    .trait:nth-child(2) .trait-fill{background:#a898cd}.trait:nth-child(3) .trait-fill{background:#b7bd81}
    .traits-note{grid-column:1/-1;font-size:10px;color:#89917d;margin:0}
    .confetti{position:fixed;top:-20px;left:var(--left);width:7px;height:15px;border-radius:2px;pointer-events:none;z-index:10;background:var(--color);animation:confetti 1.9s var(--delay) ease-in forwards}
    .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,25px);max-width:calc(100% - 32px);padding:13px 20px;border-radius:9px;background:var(--ink);color:var(--white);font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center;box-shadow:0 4px 20px #0002}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .copy-panel{max-width:440px;margin-top:14px}
    .copy-panel label{display:block;font-size:12px;margin-bottom:8px;color:var(--muted)}
    .copy-panel textarea{width:100%;height:95px;padding:12px;background:var(--white);border:1px solid var(--line);border-radius:7px;font:13px/1.5 Arial,sans-serif;resize:vertical;color:var(--ink)}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes leave{to{opacity:0;transform:translateY(-9px)}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-13px) rotate(-9deg)}}
    @keyframes labelFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(-3deg)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes blink{0%,90%,100%{opacity:1}94%{opacity:.2}}
    @keyframes answerIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    @keyframes revealRadio{from{opacity:0;transform:translateY(40px) rotate(3deg) scale(.88)}to{opacity:1;transform:translateY(0) rotate(-12deg) scale(1)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes confetti{to{transform:translate(var(--drift),105vh) rotate(550deg);opacity:0}}
    @media(min-width:1500px){.shell{padding:0 72px}.split{min-height:700px}.stage{height:580px}}
    @media(max-width:1100px){.shell{padding:0 36px}.split{gap:18px}.stage{height:490px}.radio-wrap{width:280px}.question-layout{gap:28px;grid-template-columns:1.55fr 1fr}.quiz-stage{height:350px}.quiz-stage .floating-label{font-size:8px;left:-8px}.collection{align-items:flex-start}.model-list{gap:10px 15px}.result-view .split{gap:25px}}
    @media(max-width:760px){.shell{padding:0 24px}.header{height:84px}.brand{font-size:12px}.brand-mark{width:35px;height:35px}.header-right{gap:14px}.header-right .status{font-size:9px}.split{grid-template-columns:1fr;padding:36px 0 25px;gap:12px;min-height:0}.eyebrow{font-size:10px;margin-bottom:20px}h1{font-size:clamp(64px,13.5vw,92px);max-width:560px;margin-bottom:22px}.intro-copy{font-size:15px;margin-bottom:23px;max-width:400px}.intro-copy br{display:none}.hero-note{display:none}.stage{height:400px;max-width:470px;width:100%;margin:0 auto}.radio-wrap{width:225px;max-width:60%}.stage-label{top:10px;right:8px}.floating-label{bottom:53px;left:4px;font-size:9px}.live-badge{top:95px;right:8px;font-size:10px}.stage-bottom{bottom:0}.cross-a{top:10px}.cross-b{bottom:30px}.orbit.three{width:88%}.orbit.one{width:72%}.orbit.two{width:53%}.frequency{height:55px;padding:0}.frequency span{font-size:9px;padding:7px 5px 0}.collection{flex-direction:column;padding:22px 0;gap:14px}.model-list{justify-content:flex-start;gap:12px 18px;font-size:10px}.footer{font-size:9px;padding:19px 0}.footer-end{white-space:nowrap}main{min-height:0}.quiz-view{min-height:0;padding:25px 0 35px}.progress-track{margin-bottom:28px}.question-layout{display:block}.quiz-side{display:none}h2{font-size:34px}.question-category{font-size:10px}.answer{padding:15px 13px;min-height:83px;gap:12px}.answer-title{font-size:13px}.answer-sub{font-size:11px}.keyboard-hint{display:none}.question-bottom{justify-content:flex-end;margin-top:20px}.question-bottom .primary{width:100%}.scan-view{min-height:600px}.result-view .split{padding-top:32px;gap:10px}.result-title{font-size:57px}.result-copy{max-width:none}.result-tagline{font-size:17px}.result-stage{height:415px}.result-stage .floating-label{bottom:35px}.traits{gap:15px;padding-top:22px}.trait-head{font-size:10px;flex-direction:column;gap:5px}.traits-note{font-size:9px}.result-caption{margin-top:9px}.result-view{padding-bottom:26px}}
    @media(max-width:380px){.shell{padding:0 18px}.header-right .status{display:none}h1{font-size:64px}.primary{gap:18px;padding:17px 20px}.button-caption{font-size:10px;gap:7px}.button-caption span+span::before{margin-right:7px}.stage{height:365px}.radio-wrap{width:205px}.result-title{font-size:48px}.result-actions{flex-direction:column}.result-actions button{width:100%}.footer{gap:8px}.footer-end{font-size:8px}}

  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 10v4m4-7v10m4-13v16m4-13v10m4-7v4"/></svg></span><span>НА ОДНОЙ<br>ВОЛНЕ</span></div>
      <div class="header-right"><div class="status mono"><span class="status-dot"></span>На связи</div><button class="sound-btn" id="sound" aria-label="Включить звуки" aria-pressed="false" title="Включить звуки"></button></div>
    </header>
    <main id="main"></main>
    <footer class="footer"><span>Развлекательный квиз. Все совпадения — на твоей частоте.</span><span class="footer-end">Сделано с приёмом <span aria-hidden="true">↗</span></span></footer>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;text-align:center">Чтобы пройти квиз, включи JavaScript в браузере.</p></noscript>
  <script>
    'use strict';
    const $ = (selector, root = document) => root.querySelector(selector);
    const main = $('#main');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const arrow = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
    const wave = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4m4-7v10m4-13v16m4-13v10m4-7v4"/></svg>';

      if (selection.length!==questions.length) throw new Error('Нужно ответить на каждый вопрос');
      // При равном счёте решает самый поздний ответ, различающий лидеров.
      let contenders = scores.map((value,index)=>({value,index})).filter(item=>item.value===Math.max(...scores)).map(item=>item.index);
      for(let i=selection.length-1;contenders.length>1 && i>=0;i--){
        const weights=questions[i].answers[selection[i]].scores;
        const best=Math.max(...contenders.map(index=>weights[index]));
        contenders=contenders.filter(index=>weights[index]===best);
      }
      return profiles[contenders[0]];
    }

    function resultView() {
      const p=currentProfile;
      return `<section class="view result-view"><div class="split"><div><p class="eyebrow mono">Сигнал пойман. Это точно ты.</p><h1 class="result-title" id="view-title" tabindex="-1">${p.brand}<span>${p.model}</span></h1><p class="result-tagline">${p.role}</p><p class="result-copy">${p.description}</p><div class="tags">${p.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div><blockquote class="result-quote"><span class="mono">Твой позывной по жизни</span>${p.quote}</blockquote><div class="result-actions"><button class="primary" data-action="save"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg>Сохранить карточку</button><button class="secondary" data-action="share">Скопировать результат ↗</button></div><button class="text-button result-restart" data-action="restart">↻ Пройти ещё раз</button><div class="copy-panel" id="copy-panel" hidden><label for="result-text">Скопируй текст вручную:</label><textarea id="result-text" readonly></textarea></div></div><div>${stage(p,'result')}<p class="result-caption">Художественная иллюстрация · Характер важнее характеристик</p></div></div><div class="traits">${['Жажда приключений','Внутренняя опора','Общительность'].map((trait,i)=>`<div class="trait"><div class="trait-head"><span>${trait}</span><span>${p.stats[i]} / 100</span></div><div class="trait-track"><div class="trait-fill" style="width:${p.stats[i]}%"></div></div></div>`).join('')}<p class="traits-note">Шуточный портрет характера, а не технические характеристики рации или психологическая диагностика.</p></div></section>`;
    }

    async function navigate(next, options={}) {
      if (transitioning) return;
      transitioning=true;
      const old=$('.view',main);
      if(old && !reducedMotion.matches){old.classList.add('leaving');await new Promise(resolve=>setTimeout(resolve,170));}
      screen=next;
      if(next==='intro')main.innerHTML=introView();
      if(next==='quiz')main.innerHTML=quizView();
      if(next==='result')main.innerHTML=resultView();
      if(next==='scan')main.innerHTML=`<section class="view scan-view"><div class="radar" aria-hidden="true">${wave}</div><p class="eyebrow mono">Настройка завершена</p><h2 id="view-title" tabindex="-1">Ловим твою частоту…</h2><p id="scan-status" role="status">Убираем шум. Оставляем характер.</p></section>`;
      transitioning=false;
      if(!options.initial){
        window.scrollTo({top:0,behavior:'instant'});
        $('#view-title')?.focus({preventScroll:true});
      }
      if(next==='result'){beep(660,.12);celebrate();}
      if(next==='scan'){
        await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?200:1000));
        $('#scan-status').textContent='Контакт есть. Твоя рация найдена!';
        await new Promise(resolve=>setTimeout(resolve,reducedMotion.matches?100:750));
        navigate('result');
      }
    }

    function selectAnswer(index) {
      if(screen!=='quiz'||transitioning||index<0||index>3)return;
      answers[questionIndex]=index;
      document.querySelectorAll('[data-answer]').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
      $('[data-action="next"]').disabled=false;
      $('#announcer').textContent='Выбрано: '+questions[questionIndex].answers[index].title;
      beep(420+index*70,.055);
    }

    function nextQuestion() {
      if(screen!=='quiz'||transitioning||answers[questionIndex]===null)return;
      beep(590,.05);
      if(questionIndex<questions.length-1){questionIndex++;navigate('quiz');}
      else{currentProfile=calculateResult(answers);navigate('scan');}
    }

    function restart(){answers=Array(questions.length).fill(null);questionIndex=0;currentProfile=null;navigate('quiz');}

    main.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if(!button||button.disabled||transitioning)return;
      if(button.hasAttribute('data-answer')){selectAnswer(Number(button.dataset.answer));return;}
      switch(button.dataset.action){
        case 'start':case 'restart':restart();break;
        case 'next':nextQuestion();break;
        case 'back':if(questionIndex===0)navigate('intro');else{questionIndex--;navigate('quiz');}break;
        case 'save':saveCard();break;
        case 'share':copyResult();break;
      }
    });

    document.addEventListener('keydown',event=>{
      if(screen!=='quiz'||transitioning||event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
      if(/^[1-4]$/.test(event.key)){event.preventDefault();selectAnswer(Number(event.key)-1);}
      if(event.key==='Enter' && !event.target.closest('button,a,input,textarea,select')){event.preventDefault();nextQuestion();}
      else if(event.key==='Enter' && event.target.closest('[data-answer]') && answers[questionIndex]===Number(event.target.closest('[data-answer]').dataset.answer)){event.preventDefault();nextQuestion();}
    });

    function updateSound(){
      const button=$('#sound');
      button.setAttribute('aria-pressed',String(soundOn));
      button.setAttribute('aria-label',soundOn?'Выключить звуки':'Включить звуки');
      button.title=soundOn?'Выключить звуки':'Включить звуки';
      button.innerHTML=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/>${soundOn?'<path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>':'<path d="m16 9 5 6m0-6-5 6"/>'}</svg>`;
    }

    function beep(frequency=440,duration=.07){
      if(!soundOn||!audioContext)return;
      try{
        if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
        const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();
        const now=audioContext.currentTime;
        oscillator.type='sine';oscillator.frequency.setValueAtTime(frequency,now);
        gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.035,now+.01);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
        oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(now);oscillator.stop(now+duration+.02);
        oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
      }catch{/* Звук необязателен: квиз работает и без аудио. */}
    }

    $('#sound').addEventListener('click',()=>{
      if(!soundOn){
        const Audio=window.AudioContext||window.webkitAudioContext;
        if(!Audio){showToast('Этот браузер не поддерживает звуки');return;}
        try{audioContext=audioContext||new Audio();}catch{showToast('Звуки недоступны в этом браузере');return;}
      }
      soundOn=!soundOn;updateSound();beep(720,.08);
    });

    function celebrate(){
      if(reducedMotion.matches)return;
      for(let i=0;i<24;i++){
        const piece=document.createElement('div');piece.className='confetti';piece.setAttribute('aria-hidden','true');
        piece.style.cssText=`--left:${12+Math.random()*76}%;--color:${[currentProfile.accent,'#c6b9ed','#a3b68b','#eac58f'][i%4]};--delay:${Math.random()*.35}s;--drift:${-90+Math.random()*180}px`;
        document.body.appendChild(piece);setTimeout(()=>piece.remove(),2500);
      }
    }

    function showToast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500);}

    async function copyResult(){
      const p=currentProfile,text=`Я — ${p.name}! ${p.role}.\n${p.quote}\nА какая ты рация? Квиз «На одной волне».`;
      try{
        if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(text);showToast('Результат скопирован. Передавай в эфир!');
      }catch{
        const area=$('#result-text');$('#copy-panel').hidden=false;area.value=text;area.focus();area.select();
        showToast('Выделили результат — скопируй его вручную');
      }
    }

    function saveCard(){
      const p=currentProfile;
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect width="1080" height="1350" fill="#efeee8"/><circle cx="540" cy="660" r="335" fill="${p.accent}" fill-opacity=".28"/><circle cx="540" cy="660" r="310" fill="none" stroke="#c5ceba" stroke-width="2"/><circle cx="540" cy="660" r="235" fill="none" stroke="#c5ceba" stroke-dasharray="6 10"/><g font-family="Arial,Helvetica,sans-serif" fill="#20251f"><text x="75" y="86" font-size="24" font-weight="700" letter-spacing="3">НА ОДНОЙ ВОЛНЕ</text><text x="1005" y="85" text-anchor="end" font-size="18" letter-spacing="2">МОЯ РАЦИЯ</text><path d="M75 117h930" stroke="#c5ceba"/><text x="540" y="215" font-size="64" font-weight="800" text-anchor="middle">${escapeXml(p.name)}</text><text x="540" y="267" font-size="29" text-anchor="middle">${escapeXml(p.role)}</text><g transform="translate(322 315) scale(1.45)">${radioSvg(p,p.lcd)}</g><rect x="150" y="1085" width="780" height="68" rx="12" fill="${p.accent}"/><text x="540" y="1128" text-anchor="middle" font-size="23">${p.tags.map(escapeXml).join('  ·  ')}</text><text x="540" y="1213" font-size="28" text-anchor="middle" font-weight="700">А какая ты рация?</text><text x="540" y="1253" font-size="19" text-anchor="middle" fill="#78836b">8 вопросов. 6 характеров. Твоя частота.</text><path d="M75 1290h930" stroke="#c5ceba"/></g></svg>`;
      const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
      const link=document.createElement('a');link.href=url;link.download=`my-radio-${p.id}.svg`;document.body.appendChild(link);link.click();link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);showToast('Карточка SVG готова к сохранению');
    }

    updateSound();navigate('intro',{initial:true});
  </script>
</body>
</html>
